# Confere cada envio ao GitHub: testes automáticos e montagem do app.
# A Vercel roda os mesmos testes antes de publicar (vercel.json), então uma versão
# que quebre os testes não chega ao ar; aqui o envio também fica marcado em vermelho.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
